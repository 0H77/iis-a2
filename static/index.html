<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study assistant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Chats">
    <button type="button" class="rail-toggle" id="rail-toggle" aria-label="Close sidebar" title="Close sidebar" aria-expanded="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg>
    </button>
    <button type="button" class="new-chat" id="new-chat" title="New chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      <span class="rail-text">New chat</span>
    </button>
    <span class="rail-label" id="recent-label">Recent</span>
    <div id="recent" class="recent"></div>
  </nav>

  <main class="main" id="main">
    <h1 class="welcome">What are we revising?</h1>
    <div class="thread" id="thread">
      <div id="messages" class="messages"></div>
    </div>

    <div class="composer-wrap">
      <div class="menu" id="menu" role="menu" aria-label="Add" hidden>
        <div class="menu-panel" id="menu-main">
          <button type="button" class="menu-item" role="menuitem" id="menu-files">
            <span>Add files</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
          <div class="menu-separator" role="separator" id="menu-separator"></div>
          <button type="button" class="menu-item" role="menuitem" id="menu-rule">
            <span>Study rule</span><span class="menu-detail" id="menu-rule-detail">Off</span>
          </button>
          <div class="menu-tip-wrap" id="menu-answer-wrap">
            <button type="button" class="menu-item" role="menuitem" id="menu-answer" aria-describedby="menu-tip">
              <span>Use an answer</span><span class="menu-detail" id="menu-answer-count"></span>
            </button>
            <span class="menu-tip" role="tooltip" id="menu-tip">No answers left. Start a new chat to change your limit.</span>
          </div>
        </div>
        <div class="menu-panel" id="menu-files-panel" hidden>
          <span class="menu-label">Recent files</span>
          <div id="recent-files" class="menu-panel"></div>
          <div class="menu-separator" role="separator"></div>
          <button type="button" class="menu-item" role="menuitem" id="menu-upload"><span>Upload from computer</span></button>
        </div>
      </div>
      <input type="file" id="file-input" accept=".md,.txt,.markdown,text/plain,text/markdown" hidden>
      <div class="attachment-tray" id="attachment-tray" hidden></div>
      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="icon-button" id="plus" aria-label="Add" aria-haspopup="menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
        <label for="msg" class="visually-hidden">Message</label>
        <input id="msg" placeholder="Reply">
        <button type="submit" class="send" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
        </button>
      </form>
      <p class="status" id="status" hidden></p>
    </div>

    <div class="dialog-layer" id="dialog" hidden>
      <div class="scrim" id="scrim"></div>
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <div class="dialog-head">
          <h2 id="dialog-title">Study rule</h2>
          <p>How should the assistant help you in this chat?</p>
        </div>
        <label for="rule" class="visually-hidden">Your rule</label>
        <textarea id="rule" rows="3" maxlength="300" placeholder="e.g. Hints only"></textarea>
        <div class="answers">
          <span id="answers-label">Answers allowed</span>
          <div role="radiogroup" aria-labelledby="answers-label" id="answers"></div>
        </div>
        <p class="dialog-note">You can't change this once you start chatting.</p>
        <div class="dialog-buttons">
          <button type="button" class="button-secondary" id="rule-cancel">Cancel</button>
          <button type="button" class="button-primary" id="rule-start" disabled>Start</button>
        </div>
      </section>
    </div>

    <dialog class="confirm" id="confirm-answer" aria-labelledby="confirm-title" aria-describedby="confirm-text">
      <div class="dialog-head">
        <h1 id="confirm-title">Use an answer?</h1>
        <p id="confirm-text"></p>
      </div>
      <form method="dialog" class="dialog-buttons">
        <button value="cancel" class="button-secondary" autofocus>Cancel</button>
        <button value="use" class="button-primary">Use answer</button>
      </form>
    </dialog>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
